homeassistant:
  packages: !include_dir_named packages #location of AlphaESS Modbus integration
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml


# -------------------------------------------------------------------
# PREDAT IMPORT & EXPORT PRICE TEMPLATES (Nordpool)
# -------------------------------------------------------------------
input_number:
  energy-tax:
    name: "energy-tax"
    min: 0.0
    max: 1.0
    step: 0.001
    initial: 0.092
    unit_of_measurement: "€"
    icon: mdi:currency-eur

  import-cost:
    name: "import-cost"
    min: 0.0
    max: 1.0
    step: 0.001
    initial: 0.016
    unit_of_measurement: "€"
    icon: mdi:currency-eur
    
  export-cost:
    name: "export-cost"
    min: -1.0
    max: 1.0
    step: 0.001
    initial: -0.016
    unit_of_measurement: "€"
    icon: mdi:currency-eur
    
  vat:
    name: "vat"
    min: 1
    max: 2
    step: 0.001
    initial: 1.21
    icon: mdi:percent


template:
  - trigger:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        hours: "/1"
    action:
      - action: nordpool.get_price_indices_for_date
        data:
          config_entry: <YOUR NORDPOOL CONFIG_ENTRY>
          date: "{{ now().strftime('%Y-%m-%d') }}"
          areas:
            - <YOUR AREA>
          currency: EUR
          resolution: '60'
        response_variable: nordpool_today
      - action: nordpool.get_price_indices_for_date
        data:
          config_entry: <YOUR NORDPOOL CONFIG_ENTRY>
          date: "{{ (now() + timedelta(days=1)).strftime('%Y-%m-%d') }}"
          areas:
            - <YOUR AREA>
          currency: EUR
          resolution: '60'
        response_variable: nordpool_tomorrow
    sensor:
      - name: "Predbat Import Rates"
        unique_id: predbat_import_rates_nordpool
        unit_of_measurement: "EUR/kWh"
        state: >
          {% set market_price = states('<NORDPOOL CURRENT MARKET PRICE SENSOR>') | float(0) %}
          {% set eTax = states('input_number.energy-tax') | float(0) %}
          {% set vat = states('input_number.vat') | float(0) %}
          {% set import_cost = states('input_number.import-cost') | float(0) %}
          {{ ((market_price + eTax + import_cost) * vat) | round(5) }}
        attributes:
          raw_today: >
            {% set ns = namespace(items=[]) %}
            {% set eTax = states('input_number.energy-tax') | float(0) %}
            {% set vat = states('input_number.vat') | float(0) %}
            {% set import_cost = states('input_number.import-cost') | float(0) %}
            {% if nordpool_today is defined and nordpool_today.<YOUR AREA> is defined %}
              {% for item in nordpool_today.<YOUR AREA> %}
                {% set price = ((item.price / 1000) + eTax + import_cost) | round(5) %}
                {% set price_vat = (price * vat) | round(5) %}
                {% set ns.items = ns.items + [{
                  'start': item.start,
                  'end': item.end,
                  'value': price,
                  'value_inc_vat': price_vat
                }] %}
              {% endfor %}
            {% endif %}
            {{ ns.items }}
          raw_tomorrow: >
            {% set ns = namespace(items=[]) %}
            {% set eTax = states('input_number.energy-tax') | float(0) %}
            {% set vat = states('input_number.vat') | float(0) %}
            {% set import_cost = states('input_number.import-cost') | float(0) %}
            {% if nordpool_tomorrow is defined and nordpool_tomorrow.<YOUR AREA> is defined %}
              {% for item in nordpool_tomorrow.<YOUR AREA> %}
                {% set price = ((item.price / 1000) + eTax + import_cost) | round(5) %}
                {% set price_vat = (price * vat) | round(5) %}
                {% set ns.items = ns.items + [{
                  'start': item.start,
                  'end': item.end,
                  'value': price,
                  'value_inc_vat': price_vat
                }] %}
              {% endfor %}
            {% endif %}
            {{ ns.items }}

      - name: "Predbat Export Rates"
        unique_id: predbat_export_rates_nordpool
        unit_of_measurement: "EUR/kWh"
        state: >
          {% set market_price = states('<NORDPOOL CURRENT MARKET PRICE SENSOR>') | float(0) %}
          {% set export_cost = states('input_number.export-cost') | float(-0.016) %}
          {% set eTax = states('input_number.energy-tax') | float(0) %}
          {% set vat = states('input_number.vat') | float(0) %}
          {{ (((market_price + export_cost + eTax) * vat)) | round(5) }}
        attributes:
          raw_today: >
            {% set ns = namespace(items=[]) %}
            {% set export_cost = states('input_number.export-cost') | float(-0.016) %}
            {% set eTax = states('input_number.energy-tax') | float(0) %}
            {% set vat = states('input_number.vat') | float(0) %}
            {% if nordpool_today is defined and nordpool_today.<YOUR AREA> is defined %}
              {% for item in nordpool_today.<YOUR AREA> %}
                {% set price = ((item.price / 1000) + export_cost + eTax) | round(5) %}
                {% set price_vat = (price * vat) | round(5) %}
                {% set ns.items = ns.items + [{
                  'start': item.start,
                  'end': item.end,
                  'value': price,
                  'value_inc_vat': price_vat
                }]%}
              {% endfor %}
            {% endif %}
            {{ ns.items }}
          raw_tomorrow: >
            {% set ns = namespace(items=[]) %}
            {% set export_cost = states('input_number.export-cost') | float(-0.016) %}
            {% set eTax = states('input_number.energy-tax') | float(0) %}
            {% set vat = states('input_number.vat') | float(0) %}
            {% if nordpool_tomorrow is defined and nordpool_tomorrow.<YOUR AREA> is defined %}
              {% for item in nordpool_tomorrow.<YOUR AREA> %}
                {% set price = ((item.price / 1000) + export_cost + eTax) | round(5) %}
                {% set price_vat = (price * vat) | round(5) %}
                {% set ns.items = ns.items + [{
                  'start': item.start,
                  'end': item.end,
                  'value': price,
                  'value_inc_vat': price_vat
                }]%}
              {% endfor %}
            {% endif %}
            {{ ns.items }}
