alias: AlphaESS - Predbat Koppeling
description: >-
  Stuurt AlphaESS Modbus Dispatch aan met volledige register-aansturing voor
  zowel Charging als Exporting
triggers:
  - trigger: state
    entity_id: predbat.status
  - trigger: time_pattern
    minutes: /30
actions:
  - choose:
      - conditions:
          - condition: state
            entity_id: predbat.status
            state: Charging
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.alphaess_helper_force_charging
                - input_boolean.alphaess_helper_force_discharging
          - action: input_select.select_option
            target:
              entity_id: input_select.alphaess_helper_dispatch_mode
            data:
              option: State of Charge Control (2)
          - action: input_number.set_value
            target:
              entity_id: input_number.alphaess_helper_dispatch_cutoff_soc
            data:
              value: 98
          - action: input_number.set_value
            target:
              entity_id: input_number.alphaess_helper_dispatch_power
            data:
              value: -6
          - action: input_number.set_value
            target:
              entity_id: input_number.alphaess_helper_dispatch_duration
            data:
              value: 60
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.alphaess_helper_dispatch
      - conditions:
          - condition: state
            entity_id: predbat.status
            state: Exporting
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.alphaess_helper_force_charging
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.alphaess_helper_force_discharging
          - action: input_select.select_option
            target:
              entity_id: input_select.alphaess_helper_dispatch_mode
            data:
              option: State of Charge Control (2)
          - action: input_number.set_value
            target:
              entity_id: input_number.alphaess_helper_dispatch_power
            data:
              value: 6
          - action: input_number.set_value
            target:
              entity_id: input_number.alphaess_helper_dispatch_duration
            data:
              value: 60
          - action: input_number.set_value
            target:
              entity_id: input_number.alphaess_helper_discharging_cutoff_soc
            data:
              value: "{{ states('sensor.predbat_car_soc_min') | int(4) }}"
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.alphaess_helper_dispatch
      - conditions:
          - condition: state
            entity_id: predbat.status
            state: Freeze charging
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.alphaess_helper_force_charging
                - input_boolean.alphaess_helper_force_discharging
                - input_boolean.alphaess_helper_dispatch
          - action: input_number.set_value
            target:
              entity_id: input_number.alphaess_helper_dispatch_power
            data:
              value: 0
          - action: input_number.set_value
            target:
              entity_id: input_number.alphaess_helper_dispatch_duration
            data:
              value: 0
          - action: input_number.set_value
            target:
              entity_id: input_number.alphaess_helper_discharging_cutoff_soc
            data:
              value: '{{ states(''sensor.alphaess_soc_battery'') | int }}'
      - conditions:
          - condition: state
            entity_id: predbat.status
            state:
              - Demand
              - Demand (Holiday)
              - Hold charging
              - No Charge
              - Idle
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.alphaess_helper_force_charging
                - input_boolean.alphaess_helper_force_discharging
                - input_boolean.alphaess_helper_dispatch
          - action: input_number.set_value
            target:
              entity_id: input_number.alphaess_helper_dispatch_power
            data:
              value: 0
          - action: input_number.set_value
            target:
              entity_id: input_number.alphaess_helper_dispatch_duration
            data:
              value: 0
          - action: input_number.set_value
            target:
              entity_id: input_number.alphaess_helper_discharging_cutoff_soc
            data:
              value: 4
    default:
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.alphaess_helper_force_charging
            - input_boolean.alphaess_helper_force_discharging
            - input_boolean.alphaess_helper_dispatch
      - action: input_number.set_value
        target:
          entity_id: input_number.alphaess_helper_dispatch_power
        data:
          value: 0
      - action: input_number.set_value
        target:
          entity_id: input_number.alphaess_helper_dispatch_duration
        data:
          value: 0
mode: restart
