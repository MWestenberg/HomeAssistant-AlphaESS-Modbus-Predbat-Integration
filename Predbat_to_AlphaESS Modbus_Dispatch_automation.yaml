alias: Predbat to AlphaESS Modbus Dispatch
description: Tranlates Predbat status and Watt to AlphaESS kW Modbus dispatch helpers
triggers:
  - trigger: state
    entity_id:
      - predbat.status
      - input_boolean.predbat_charge_enable
      - input_boolean.predbat_discharge_enable
      - input_number.predbat_charge_limit
      - input_number.predbat_reserve_soc
      - input_number.predbat_charge_rate
      - input_number.predbat_discharge_rate
  - trigger: state
    entity_id: predbat.status
    attribute: run_state
actions:
  - choose:
      - conditions:
          - condition: state
            entity_id: input_boolean.predbat_charge_enable
            state: 'on'
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.alphaess_helper_force_discharging
                - input_boolean.alphaess_helper_dispatch
          - action: input_number.set_value
            target:
              entity_id: input_number.alphaess_helper_force_charging_power
            data:
              value: >-
                {{ (states('input_number.predbat_charge_rate') | float(3000) /
                1000) | round(2) }}
          - action: input_number.set_value
            target:
              entity_id: input_number.alphaess_helper_force_charging_duration
            data:
              value: 60
          - action: input_number.set_value
            target:
              entity_id: input_number.alphaess_helper_force_charging_cutoff_soc
            data:
              value: >-
                {{ [states('input_number.predbat_charge_limit') | int(100), 4] |
                max }}
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.alphaess_helper_force_charging
      - conditions:
          - condition: state
            entity_id: input_boolean.predbat_discharge_enable
            state: 'on'
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.alphaess_helper_force_charging
                - input_boolean.alphaess_helper_dispatch
          - action: input_number.set_value
            target:
              entity_id: input_number.alphaess_helper_force_discharging_power
            data:
              value: >-
                {{ (states('input_number.predbat_discharge_rate') | float(3000)
                / 1000) | round(2) }}
          - action: input_number.set_value
            target:
              entity_id: input_number.alphaess_helper_force_discharging_duration
            data:
              value: 60
          - action: input_number.set_value
            target:
              entity_id: input_number.alphaess_helper_force_discharging_cutoff_soc
            data:
              value: >-
                {{ [states('input_number.predbat_reserve_soc') | int(10), 4] |
                max }}
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.alphaess_helper_force_discharging
      - conditions:
          - condition: template
            value_template: >-
              {{ 'Freeze' in (state_attr('predbat.status', 'run_state') |
              string) }}
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.alphaess_helper_force_charging
                - input_boolean.alphaess_helper_force_discharging
          - action: input_number.set_value
            target:
              entity_id: input_number.alphaess_helper_dispatch_power
            data:
              value: 0
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.alphaess_helper_dispatch
    default:
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.alphaess_helper_force_charging
            - input_boolean.alphaess_helper_force_discharging
            - input_boolean.alphaess_helper_dispatch
mode: restart
